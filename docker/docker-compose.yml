services:
  oncolens-db:
    image: mongo:8
    container_name: oncolens-library-db
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: oncolens_library
      MONGO_INITDB_ROOT_USERNAME: oncolens_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    ports:
      - "27017:27017"
    
    volumes:
      - oncolens_data:/data/db
    
    healthcheck:
      test: [
        "CMD",
        "mongosh",
        "--quiet",
        "--username",
        "oncolens_user",
        "--password",
        "${MONGO_PASSWORD}",
        "--authenticationDatabase",
        "admin",
        "--eval",
        "db.adminCommand('ping')"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
  
volumes:
  oncolens_data: